# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
logLevel: info
healthCheckTimeout: 900
includeAliasesInList: true
startPort: 10001

# capacity is only reclaimed when a process actually stops
globalTTL: 900
# podman stop is slower than a signal; 10s (the default) can force-kill mid-shutdown
unloadTimeout: 30
# hard ceiling across all models at once; over it = immediate 429, not queued
globalConcurrencyLimit: 8

# warm at startup; after 900s idle the global TTL reclaims it like any other model
hooks:
  on_startup:
    preload:
      - gufo-flash-next

macros:
  dir: /var/lib/models/llama
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-10.0-strix-llama
  run: |
    podman run --pull always --rm --replace --name ls-${MODEL_ID} --device /dev/dri --device /dev/kfd --group-add video --group-add render --security-opt seccomp=unconfined --ulimit memlock=-1:-1 --volume ${dir}:/models:ro --publish 127.0.0.1:${PORT}:9941 ${image} llama-server --host 0.0.0.0 --port 9941 --alias ${MODEL_ID} -dev ROCm0 -ngl 999 --spec-draft-device ROCm0 --spec-draft-ngl 99 --ctx-size 131072 --load-mode dio --lazy-mode on-direct --kv-unified --cache-type-k f16 --cache-type-v f16 --flash-attn on --fit off --batch-size 16384 --jinja
  moe: |
    --spec-type draft-mtp --spec-draft-n-max 3 --cache-reuse 256 --cont-batching --ubatch-size 4096
  gufo_cache: /var/cache/gufo
  # installed by ./run-gufo.sh ext install. A model loads a module only if its
  # image's extension API matches the one it was built against, so the :latest
  # models below skip it ("needs update" in gufo extension list).
  gufo_ext: $HOME/.local/share/gufo/extensions
  gufo_image: ghcr.io/gufo-org/toolboxes/gufo-runtime:latest
  # SSL_CERT_FILE: the image carries its CA bundle as one file OpenSSL does not
  # pick up on its own, so registry fetches warn "unable to get local issuer".
  gufo_pod: >-
    podman run --pull always --rm --replace --name ls-${MODEL_ID} --device
    /dev/dri --device /dev/kfd --group-add keep-groups --ulimit memlock=-1
    --userns keep-id:uid=1000,gid=1000 --volume ${dir}:/models:ro --volume
    ${gufo_cache}:/gufo_cache:rw,z --volume
    ${gufo_ext}:/home/gufo/.local/share/gufo/extensions:rw,z --env
    GUFO_EXTENSIONS_DIR=/home/gufo/.local/share/gufo/extensions --env
    SSL_CERT_FILE=/etc/ssl/certs/ca-bundle.crt --publish
    127.0.0.1:${PORT}:8080
  # gufo's flags, split so a model can change the image or the session count
  # without repeating them; gufo_ds41_run below is DS41's 2-session variant.
  gufo_serve_llm: >-
    gufo serve --host 0.0.0.0 --port 8080 llm
  gufo_sessions: --sessions 4 --max-pending-per-client 4
  gufo_serve_tail: >-
    --max-tokens 32768 --context 131072 --cache-disk /gufo_cache
    --reasoning-effort xhigh --preserve-thinking on
  # llama-swap expands macros in file order: gufo_pod, gufo_serve_llm,
  # gufo_sessions and gufo_serve_tail must stay above the run macros below.
  gufo_run: >-
    ${gufo_pod} ${gufo_image} ${gufo_serve_llm} ${gufo_sessions}
    ${gufo_serve_tail}
  # DS41 with 2 sessions and no vision projector: IQ1_M leaves about 1.7 GiB of
  # host memory at 4 sessions, so it takes the smaller set.
  gufo_ds41_run: >-
    ${gufo_pod} ${gufo_image} ${gufo_serve_llm} --sessions 2
    --max-pending-per-client 4 ${gufo_serve_tail}
  # Loom (github.com/loom-fun/loom-gufo-extension) runs a package's own
  # kernels through libloom_text_embed. It needs extension API 0.3.35, which the
  # toolbox image (0.3.20) does not have, so this gufo is built by Nix into the
  # gufo-nix volume; loom/gufo symlinks it (see loom/README.md). gufo_pod is not
  # reusable: Loom's GPU memory reservation needs seccomp=unconfined, and the
  # module is compiled in, so mounting ${gufo_ext} would only invite a mismatch.
  loom_dir: $HOME/strix/launchers/loom
  loom_image: docker.io/nixos/nix:latest
  loom_pod: >-
    podman run --rm --replace --name ls-${MODEL_ID} --device /dev/dri --device
    /dev/kfd --group-add keep-groups --security-opt seccomp=unconfined --ulimit
    memlock=-1 --userns keep-id:uid=1000,gid=1000 --volume ${dir}:/models:ro
    --volume ${loom_dir}:/loom:ro --volume gufo-nix:/nix:ro --env
    GUFO_MODELS_DIR=/models --publish 127.0.0.1:${PORT}:8080
  # bare `gufo` is on the toolbox image's PATH only, so the nix gufo is named:
  # ${gufo_serve_llm} would exit with "executable file not found in $PATH".
  loom_serve_llm: >-
    /loom/gufo serve --host 0.0.0.0 --port 8080 llm
  ds41_dir: /models/DeepSeek-V4.1-Flash-1017
  ds41_q: DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ1_M
  ds41_draft: DeepSeek-V4.1-Flash-1017-DSpark-draft-Q2K-Q4K.gguf
  hipfire_cache: $HOME/hipfire-kcache
  hipfire_dir: /var/lib/models/hipfire
  hipfire_image: localhost/hipfire:latest
  hipfire_run: |
    podman run --rm --replace --name ls-${MODEL_ID} --device /dev/dri --device /dev/kfd --device /dev/accel/accel0 --group-add keep-groups --security-opt seccomp=unconfined --ulimit memlock=-1:-1 --env HIPFIRE_QWEN4_NPU_TRUNK=auto --volume ${hipfire_dir}:/root/.hipfire/models:ro --volume ${hipfire_cache}:/var/cache/hipfire:z --publish 127.0.0.1:${PORT}:11435 ${hipfire_image}

routing:
  router:
    use: capacity
    settings:
      capacity:
        pools:
          # MiB of unified memory allowed resident at once.
          # measure real usage, then tighten to ~90% of physical
          mem: 118000
          # only one hipfire container may claim /dev/accel/accel0 at a time
          npu: 1
  scheduler:
    use: fifo
    settings:
      fifo:
        priority:
          hipfire-4b: 10
          openjev-q4: 5
          gufo-27b: 3

models:
  deepseek-v4-flash:
    name: DeepSeek V4 Flash IQ2XXS + DSpark
    cmd: |
      ${run}
      --model /models/deepseek-v4-flash/DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf --spec-type draft-dspark --spec-draft-model /models/deepseek-v4-flash/DeepSeek-V4-Flash-DSpark-support-0731.gguf --cache-reuse 256 --cont-batching
    cmdStop: podman stop ls-deepseek-v4-flash
    proxy: http://localhost:${PORT}
    capacities: { mem: 26000 }
    evict_cost: 10
    concurrencyLimit: 4

  gufo-27b:
    name: Qwen3.8 27B Q4_K_XL (gufo, dflash2)
    useModelName: Qwen3.8-27B
    cmd: |
      ${gufo_run}
      --model /models/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf --speculative dflash2 --dflash-model /models/Qwen3.8-27B-GGUF/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
    cmdStop: podman stop ls-gufo-27b
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    capacities: { mem: 30000 }
    evict_cost: 40
    concurrencyLimit: 4

  gufo-deepseek:
    name: DeepSeek V4 Flash IQ2XXS (gufo, dspark)
    useModelName: DeepSeek V4 Flash
    cmd: |
      ${gufo_run}
      --model /models/deepseek-v4-flash/DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf --dspark-model /models/deepseek-v4-flash/DeepSeek-V4-Flash-DSpark-support-0731.gguf
    cmdStop: podman stop ls-gufo-deepseek
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    capacities: { mem: 26000 }
    evict_cost: 10
    concurrencyLimit: 4

  # deepseek41flash is a compiled module: rebuild it for each pulled image with
  # ./run-gufo.sh ext update, or gufo skips it with a warning and DS41 cannot
  # load. IQ1_M is 112.4 GiB of weights, so --stream-experts keeps the dense
  # part resident and pages the 384 routed experts from SSD, filling most of
  # what is left as cache. The Engram table (103 GiB, linked as shard 00006) is
  # read from SSD and never resident.
  gufo-ds41:
    name: DeepSeek V4.1 Flash IQ1_M (gufo, dspark, streamed experts)
    # useModelName goes upstream; aliases are the names clients may use
    # (includeAliasesInList advertises them in /v1/models)
    useModelName: DeepSeek V4.1 Flash
    aliases:
      - DeepSeek V4.1 Flash
    cmd: |
      ${gufo_ds41_run}
      --model ${ds41_dir}/${ds41_q}-00001-of-00006.gguf
      --stream-experts --speculative dspark
      --dspark-model ${ds41_dir}/${ds41_draft}
    cmdStop: podman stop ls-gufo-ds41
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    # dense weights + drafter 4.6 GiB + an expert cache that defaults to "what
    # the sessions leave". It fits the 118000 pool alone: the smallest other
    # model (8000) would push it over. No --mmproj: image input costs 0.9 GiB.
    capacities: {mem: 114000}
    evict_cost: 60
    concurrencyLimit: 1

  gufo-flash-next:
    name: Qwen3.8 Flash Next (gufo)
    useModelName: Qwen3.8 Flash Next
    aliases:
      - Qwen3.8 Flash Next
    cmd: |
      ${gufo_run}
      --temperature 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0 --model /models/Qwen3.8-Flash-Next-GGUF-Gufo/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf --speculative mtp --mtp-model /models/Qwen3.8-Flash-Next-GGUF-Gufo/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf --mmproj /models/Qwen3.8-Flash-Next-GGUF-Gufo/mmproj-BF16.gguf
    cmdStop: podman stop ls-gufo-flash-next
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    # Measured, not guessed: available headroom 122.0 GiB unloaded -> 10.2 GiB
    # warm = 111.8 GiB (2.4 GiB belongs to the monitoring containers). RSS shows
    # 6.4 GiB because the rest is kfd device memory and streaming buffers, and
    # Mlocked stays 0; --cache-ram-bytes is already capped (32 GiB default), so
    # this is not a cache that will shrink. It therefore cannot share the 118000
    # pool with any other model - which is what really happens today.
    capacities: {mem: 112000}
    # no ttl key: inherits globalTTL 900 (ttl -1 = inherit, 0 = never unload)
    evict_cost: 50
    concurrencyLimit: 4

  # Inkling 2 Mini on its own engine: the inkling2 module
  # (github.com/headbouyJB/inkling2-gufo 0.1.2 = registry release 8bb6cd5, the
  # reviewed release the registry points at) rather than Loom's kernels. It runs
  # on the toolbox image through ${gufo_ext}, so it is the second module in that
  # store after deepseek41flash and the same rule applies: after `podman pull`,
  # ./run-gufo.sh ext update, or gufo skips it and this model cannot load.
  # The weights are the Loom package's GGUF (architecture `inkling2`, Unsloth
  # root layout); that package's DSpark draft is unusable here - the extension
  # declares no speculative mode and refuses one at load.
  # Measured 2026-11-22 with these exact flags (projector included):
  # host_available_mib 124441 -> 83577 = 40864 MiB at 4 sessions / 131072
  # context, 13.5 s load, 43.4 tok/s decode. Only 2.3 GiB of that was RAM cache,
  # on a budget that defaults to auto (half of free RAM, at most 32 GiB) and
  # grows with use, so the number would have crept: --cache-ram-bytes bounds it,
  # and 47000 is the measured 40864 plus the ~5900 that cache may still take on
  # the way to its 8 GiB bound. Without the projector the same load measured
  # 124581 -> 84609 = 39972 MiB in 12.4 s, so the projector costs 892 MiB and
  # 1.1 s. gufo's own gpu_device_used_mib read 55250 without it and 56150 with;
  # the host_available delta is the claim on physical RAM, so that ~15 GiB gap
  # is unexplained - TODO.md.
  # --mmproj is what enables image input: mmproj-Inkling-2-Mini-Q8_0.gguf
  # (345910944 bytes, huggingface.co/ggml-org/Inkling-2-Mini-GGUF, the file the
  # module names - unsloth's own copy is mmproj-F16.gguf at 0.64 GB) sitting
  # beside the weights in the ${dir}:/models:ro mount. Proved with a real image
  # request through llama-swap, not by reading a capability field: the module
  # README says /v1/models then advertises input_modalities [text, image], and
  # on gufo 0.35.0 it does not - the engine's /v1/models returns no such key for
  # any entry, and llama-swap strips what it does not know anyway.
  # Sampling is Unsloth's Inkling 2 Mini recommendation (unsloth.ai/docs/models
  # /inkling-2-mini): temperature 1.0, top-p 1.0, top-k 0, min-p 0.0 - no
  # truncation beyond temperature. The module registers those same four as its
  # gufo preset (src/runner.cpp: "Unsloth/OpenAI defaults: temperature 1, no
  # truncation"), so the flags change nothing today; they pin the vendor numbers
  # in case a later module release moves its preset. They do not cost clients
  # per-request control either: flash-next carries --temperature 1.0 the same
  # way, and against it a request at temperature 0 answered identically three
  # times while temperature 1.5 gave three different answers. The guide names no
  # presence/repetition/frequency penalties, so none are added and gufo leaves
  # them off. It is silent on reasoning effort, which leaves the tail's xhigh
  # (= 0.99) against the extension's own 0.9 default - TODO.md.
  gufo-inkling:
    name: Inkling-2-Mini Q4_K_XL (gufo, inkling2 kernels)
    # upstream accepts exactly the id the module lists in /v1/models -
    # "Inkling-2-Mini" and "inkling2" are refused there, so useModelName is not
    # the client name; the alias is.
    useModelName: inkling-2-mini
    aliases:
      - Inkling-2-Mini
    cmd: |
      ${gufo_run}
      --model /models/inkling-2-mini-loom/Inkling-2-Mini-UD-Q4_K_XL.gguf
      --mmproj /models/inkling-2-mini-loom/mmproj-Inkling-2-Mini-Q8_0.gguf
      --cache-ram-bytes 8589934592
      --temperature 1.0 --top-p 1.0 --top-k 0 --min-p 0.0
    cmdStop: podman stop ls-gufo-inkling
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    capacities: {mem: 47000}
    # 12 s to bring back against flash-next's 61 s, so it is the one that leaves
    evict_cost: 30
    concurrencyLimit: 4

  # `gufo model install inkling-2-mini-loom` put the package and both GGUFs in
  # ${dir}/inkling-2-mini-loom; the served name is Inkling-2-Mini, not that id.
  # The inkling2 module above took the client name, so this is the fallback:
  # clients reach it as Inkling-2-Mini-Loom. evict_cost 10 because 70 GiB is the
  # biggest claim in the pool after ds41 and flash-next, and nothing should keep
  # a fallback resident ahead of the model someone is actually using.
  # Loom commits its whole pool at load: 17.6 GiB of weights plus the state of
  # the package's chat preset (context_capacity 1048576, rows 4), measured at
  # 69.9 GiB (gufo: host_available_mib 124910 -> 53340) and it does not shrink
  # with --context, so 70000 is simply what it costs. With flash-next now
  # declaring its measured 112000, the 118000 pool keeps the two apart without
  # inflating either number.
  loom-inkling:
    name: Inkling-2-Mini Q4_K_XL (gufo + Loom, fallback)
    useModelName: Inkling-2-Mini
    aliases:
      - Inkling-2-Mini-Loom
    cmd: |
      ${loom_pod} ${loom_image} ${loom_serve_llm} ${gufo_sessions}
      --context 131072 --max-tokens 4096 --model inkling-2-mini-loom
    cmdStop: podman stop ls-loom-inkling
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    capacities: {mem: 70000}
    evict_cost: 10
    concurrencyLimit: 4

  hipfire-27b:
    name: Qwen3.8 27B mq4 (hipfire)
    useModelName: qwen3.8:27b
    cmd: |
      ${hipfire_run}
      serve qwen3.8:27b 0.0.0.0:11435
    cmdStop: podman stop ls-hipfire-27b
    proxy: http://localhost:${PORT}
    capacities: { mem: 28000, npu: 1 }
    evict_cost: 30

  hipfire-35b-a3b:
    name: Ornith 1.5 35B A3B mq4 (hipfire)
    useModelName: ornith-1.5:35b-a3b
    cmd: |
      ${hipfire_run}
      serve ornith-1.5:35b-a3b 0.0.0.0:11435
    cmdStop: podman stop ls-hipfire-35b-a3b
    proxy: http://localhost:${PORT}
    capacities: { mem: 32000, npu: 1 }
    evict_cost: 30

  hipfire-4b:
    name: Qwen3.5 4B mq4 (hipfire)
    useModelName: qwen3.5:4b
    cmd: |
      ${hipfire_run}
      serve qwen3.5:4b 0.0.0.0:11435
    cmdStop: podman stop ls-hipfire-4b
    proxy: http://localhost:${PORT}
    capacities: { mem: 8000, npu: 1 }
    evict_cost: 5

  hipfire-flash-next:
    name: Qwen3.8 Flash Next mq4 xts (hipfire)
    useModelName: qwen3.8:flash-next-mq4-xts
    cmd: |
      ${hipfire_run}
      serve qwen3.8:flash-next-mq4-xts 0.0.0.0:11435
    cmdStop: podman stop ls-hipfire-flash-next
    proxy: http://localhost:${PORT}
    capacities: { mem: 32000, npu: 1 }
    evict_cost: 30

  laya:
    name: Laya Q8_0 (test)
    cmd: |
      ${run}
      --model /models/systemone/Laya-Q8_0.gguf --spec-type none
    cmdStop: podman stop ls-laya
    proxy: http://localhost:${PORT}
    capacities: { mem: 40000 }
    evict_cost: 1
    concurrencyLimit: 4

  openjev-q4:
    name: OpenJev Q4_K_M
    cmd: |
      ${run}
      --model /models/systemone/OpenJev-Q4_K_M.gguf --spec-type none
    cmdStop: podman stop ls-openjev-q4
    proxy: http://localhost:${PORT}
    capacities: { mem: 26000 }
    evict_cost: 1
    concurrencyLimit: 4

  ornith-35b-a3b:
    name: Ornith 1.5 35B A3B coder Q4_K_XL
    cmd: |
      ${run}
      --model /models/Ornith/Tiel-Coder-35B-A3B-MTP-UD-Q4_K_XL.gguf ${moe}
    cmdStop: podman stop ls-ornith-35b-a3b
    proxy: http://localhost:${PORT}
    capacities: { mem: 34000 }
    evict_cost: 30
    concurrencyLimit: 4

  qwen3.6-27b-q8:
    name: Qwen3.6 27B Q8_K_XL (internal MTP)
    cmd: |
      ${run}
      --model /models/Qwen3.6-27B-MTP-GGUF/Qwen3.6-27B-UD-Q8_K_XL.gguf --spec-type draft-mtp --parallel 1 --ubatch-size 16384
    cmdStop: podman stop ls-qwen3.6-27b-q8
    proxy: http://localhost:${PORT}
    capacities: { mem: 45000 }
    evict_cost: 60
    concurrencyLimit: 1

  qwen3.8-27b:
    name: Qwen3.8 27B Q4_K_XL + MTP
    cmd: |
      ${run}
      --model /models/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf --spec-type draft-mtp --spec-draft-model /models/Qwen3.8-27B-GGUF/MTP/mtp-Qwen3.8-27B-Q4_0.gguf --parallel 1 --ubatch-size 16384
    cmdStop: podman stop ls-qwen3.8-27b
    proxy: http://localhost:${PORT}
    capacities: { mem: 30000 }
    evict_cost: 40
    concurrencyLimit: 1

  qwen3.8-27b-q8:
    name: Qwen3.8 27B Q8_K_XL + MTP
    cmd: |
      ${run}
      --model /models/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q8_K_XL.gguf --spec-type draft-mtp --spec-draft-model /models/Qwen3.8-27B-GGUF/MTP/mtp-Qwen3.8-27B-Q4_0.gguf --parallel 1 --ubatch-size 16384
    cmdStop: podman stop ls-qwen3.8-27b-q8
    proxy: http://localhost:${PORT}
    capacities: { mem: 45000 }
    evict_cost: 60
    concurrencyLimit: 1

  qwen3.8-35b-a3b:
    name: Qwen3.8 35B A3B Q4_K_M
    cmd: |
      ${run}
      --model /models/Qwen3.6-35B-A3B-GGUF/Qwen3.8-35B-A3B-Q4_K_M.gguf ${moe}
    cmdStop: podman stop ls-qwen3.8-35b-a3b
    proxy: http://localhost:${PORT}
    capacities: { mem: 34000 }
    evict_cost: 30
    concurrencyLimit: 4

