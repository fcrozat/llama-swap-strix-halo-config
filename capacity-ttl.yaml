# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
logLevel: info
healthCheckTimeout: 900
includeAliasesInList: true
startPort: 10001

# What a model can do comes from one of two places: a `capabilities` block
# here, or discovery - llama-swap asks the engine the first time the model
# becomes ready and keeps the answer in its SQLite store, which is ":memory:"
# unless store.path names a file (internal/store/sqlite openDB). With no store
# the listing resets to nothing on every restart: after the 20:49 restart on
# 2026-11-24 only the preload and the one model a test had loaded at 20:52
# reported anything in /v1/models, and the webui showed no badge for the other
# 17. Cached values expire after 30 d but are rewritten on every load, so a
# model in use never loses them.
# The parent directory must exist before the restart: -validate refuses a
# store.path whose parent is missing ("directory ... is not writable: no such
# file or directory") and llama-swap does not create it, so a forgotten mkdir
# fails the unit at startup instead of falling back to memory. Side effect
# worth knowing: /api/metrics/activity history now survives a restart, which
# is the store's documented purpose. Bodies stay out - persistCaptures is off.
store:
  path: ${env.HOME}/.local/share/llama-swap/llama-swap.db

# capacity is only reclaimed when a process actually stops
globalTTL: 900
# podman stop is slower than a signal; 10s (the default) can force-kill mid-shutdown
unloadTimeout: 30
# hard ceiling across all models at once; over it = immediate 429, not queued
globalConcurrencyLimit: 8

# warm at startup; after 900s idle the global TTL reclaims it like any other model
hooks:
  on_startup:
    preload:
      - gufo-flash-next

macros:
  # The account that runs llama-swap, from the process environment: ${env.VAR}
  # is llama-swap's own syntax, substituted before macro expansion. Bare ${HOME}
  # is not it - an unknown ${MACRO} is a load error - and nothing here needs a
  # shell. An unset variable fails validation outright rather than expanding to
  # empty, so a missing HOME cannot quietly turn into a "/.local/..." mount:
  # llama-swap -config config.yaml -validate refuses the file.
  home: ${env.HOME}
  dir: /var/lib/models/llama
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-10.0-strix-llama
  # --ctx-size 65536, where this macro said 131072 until 2026-11-24. Two things
  # made the case. The family is idle: 72 h of journal, every request to a gufo
  # entry (flash-next 8302, inkling 38, loom-inkling 116) and not one ${run}
  # model loaded - so the long window this macro was buying has no buyer, while
  # the 108114-token prompt on the record was gufo-flash-next, which has its own
  # macros. And context is the only lever left on a 124000 pool, measured on
  # qwen3.8-27b at 36479 MiB under 32768 against 54883 under 131072: about 201
  # KiB per token over a ~30 GiB constant that weights do not move. Only 68 of
  # those KiB are KV - 17 attention layers of 65 at 1024 dim in f16, because the
  # file's full_attention_interval is 4 - so most of the context term is
  # buffers, not cache. TODO.md §2 has the fit and the instrument caveat.
  # An entry that needs the full window says so in its own cmd with ONE
  # --ctx-size. Do not append a second after ${run}: llama.cpp honours the last
  # and warns "argument '--ctx-size' specified multiple times", which it has
  # started deprecating. The capacities in the entries below are deliberately
  # not lowered with this flag. The pool admits on claims, so the headroom only
  # arrives once each entry is re-swept at 65536; until then the claims
  # over-state and the router is stricter than the box, which is the direction
  # worth being wrong in. A guessed claim is how two models get loaded that do
  # not fit, and 65536 has been measured on exactly one of these eight.
  # yamllint disable rule:line-length
  run: |
    podman run --pull always --rm --replace --name ls-${MODEL_ID} --device /dev/dri --device /dev/kfd --group-add video --group-add render --security-opt seccomp=unconfined --ulimit memlock=-1:-1 --volume ${dir}:/models:ro --publish 127.0.0.1:${PORT}:9941 ${image} llama-server --host 0.0.0.0 --port 9941 --alias ${MODEL_ID} -dev ROCm0 -ngl 999 --spec-draft-device ROCm0 --spec-draft-ngl 99 --ctx-size 65536 --load-mode dio --lazy-mode on-direct --kv-unified --cache-type-k f16 --cache-type-v f16 --flash-attn on --fit off --batch-size 16384 --jinja
  moe: |
    --spec-type draft-mtp --spec-draft-n-max 3 --cache-reuse 256 --cont-batching --ubatch-size 4096
  # yamllint enable rule:line-length
  gufo_cache: /var/cache/gufo
  # installed by ./run-gufo.sh ext install. One module lives here now:
  # deepseek41flash, which gufo-ds41 needs for --stream-experts (not a core
  # `serve llm` option, so a skipped module is an "Unknown option" load error
  # there). A model loads a module only if its image's extension API matches
  # the one it was built against, so after every `podman pull` this store reads
  # "needs update" in gufo extension list until ./run-gufo.sh ext update runs -
  # and /ready still answers 200 while the module is skipped. Inkling no longer
  # belongs to this rule; inkling2 is built into the image since 0.37.0.
  gufo_ext: ${home}/.local/share/gufo/extensions
  gufo_image: ghcr.io/gufo-org/toolboxes/gufo-runtime:latest
  # SSL_CERT_FILE: the image carries its CA bundle as one file OpenSSL does not
  # pick up on its own, so registry fetches warn "unable to get local issuer".
  gufo_pod: >-
    podman run --pull always --rm --replace --name ls-${MODEL_ID} --device
    /dev/dri --device /dev/kfd --group-add keep-groups --ulimit memlock=-1
    --userns keep-id:uid=1000,gid=1000 --volume ${dir}:/models:ro --volume
    ${gufo_cache}:/gufo_cache:rw,z --volume
    ${gufo_ext}:/home/gufo/.local/share/gufo/extensions:rw,z --env
    GUFO_EXTENSIONS_DIR=/home/gufo/.local/share/gufo/extensions --env
    SSL_CERT_FILE=/etc/ssl/certs/ca-bundle.crt --publish
    127.0.0.1:${PORT}:8080
  # gufo's flags, split so a model can change the image or the session count
  # without repeating them; gufo_ds41_run below is DS41's 2-session variant.
  gufo_serve_llm: >-
    gufo serve --host 0.0.0.0 --port 8080 llm
  gufo_sessions: --sessions 4 --max-pending-per-client 4
  # The gufo context stays at 131072 while the llama.cpp `run` macro went to
  # 65536 on 2026-11-24, and that is a decision rather than an oversight. The
  # evidence points the other way for this family: the one 108k-token prompt on
  # the record (TODO.md §1) is gufo traffic, and 72 h of journal (TODO.md §2)
  # logged 8302 requests to flash-next against no load of any `${run}` model. So
  # the long window here has a buyer and the one that was cut had none. Cutting
  # this is the lever for ds41's exclusivity - see its entry - but nobody has
  # measured it, so no claim in this file depends on it either way.
  gufo_serve_tail: >-
    --max-tokens 32768 --context 131072 --cache-disk /gufo_cache
    --reasoning-effort xhigh --preserve-thinking on
  # llama-swap expands macros in file order: gufo_pod, gufo_serve_llm,
  # gufo_sessions and gufo_serve_tail must stay above the run macros below.
  gufo_run: >-
    ${gufo_pod} ${gufo_image} ${gufo_serve_llm} ${gufo_sessions}
    ${gufo_serve_tail}
  # DS41 with 2 sessions and no vision projector: IQ1_M leaves about 1.7 GiB of
  # host memory at 4 sessions, so it takes the smaller set.
  gufo_ds41_run: >-
    ${gufo_pod} ${gufo_image} ${gufo_serve_llm} --sessions 2
    --max-pending-per-client 4 ${gufo_serve_tail}
  # The LFM3-family providers serve through different subcommands than the
  # text set, so one macro per shape rather than one reused: the pod, image
  # and binding are the family's, the serve verb and its flags are not. Serve
  # llm (gufo_run) takes --sessions/--max-pending-per-client and the family
  # tail; serve asr/tts take neither, and serve decision takes no --sessions,
  # no --max-pending-per-client and no --cache-disk either.
  gufo_asr_run: >-
    ${gufo_pod} ${gufo_image} gufo serve --host 0.0.0.0 --port 8080 asr
  gufo_tts_run: >-
    ${gufo_pod} ${gufo_image} gufo serve --host 0.0.0.0 --port 8080 tts
  gufo_decision_run: >-
    ${gufo_pod} ${gufo_image} gufo serve --host 0.0.0.0 --port 8080 decision
  # The text shape, too: same pod, image and binding, but NOT the big-model
  # chain - the family tail (--sessions 4 --max-pending-per-client 4
  # --max-tokens 32768 --context 131072 --cache-disk /gufo_cache
  # --reasoning-effort xhigh --preserve-thinking on) is what the 100 GB+ runs
  # were measured with, not what a 2B-class entry should carry. The extension's
  # own serve example is sessions 2, a small documented context, speculative
  # off (unsupported) and the id pinned as the public name.
  gufo_lfm3_run: >-
    ${gufo_pod} ${gufo_image} gufo serve --host 0.0.0.0 --port 8080 llm
  # No loom macro: there is no loom entry, and since 0.37.0 no loom package id
  # to point one at either - `gufo model list` calls inkling-2-mini-loom
  # "installed, no loaded extension offers it" there. The Nix-built gufo this
  # block used to serve (gufo-nix volume, loom/ symlinks) is gone; TODO §6.
  ds41_dir: /models/DeepSeek-V4.1-Flash-1017
  ds41_q: DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ1_M
  ds41_draft: DeepSeek-V4.1-Flash-1017-DSpark-draft-Q2K-Q4K.gguf
  # The three Inkling 2 Mini files the entry below loads, in one directory: the
  # mainline-layout weights, the original DSpark drafter and the ggml-org
  # projector. Inkling-2-Mini-GGUF/README.md in the store carries each file's
  # byte count and sha256, and why those three rather than the files upstream
  # gives the same names. A mount-level macro, not a per-entry one, and the one
  # entry over it needs no module: core resolves both inkling2 layouts.
  inkling_dir: /models/Inkling-2-Mini-GGUF
  hipfire_cache: ${home}/hipfire-kcache
  hipfire_dir: /var/lib/models/hipfire
  # Upstream's own image: ghcr.io/warpfront/hipfire, `full` variant (labels
  # dev.hipfire.variant=full, rocm=10.1.0-3, gpu-arches include gfx1151), so the
  # kernel packs are baked in and nothing is compiled at container start. Pinned
  # to a release tag - a tag does not re-pull itself, so a bump is: edit, pull,
  # restart. `:latest` is the same variant, floating.
  hipfire_image: ghcr.io/warpfront/hipfire:0.4.7
  # 0.4.x serves as uid 1000 with HOME=/home/hipfire (the local build it
  # replaces ran as root, HOME=/root), so the store mounts under /home/hipfire -
  # and the entrypoint's own rootless probe reads $HIPFIRE_HOME/models to decide
  # whether to drop privileges, so a wrong mount point costs more than a miss.
  # The `,z` is load-bearing: a `:Z` run labels the store
  # container_file_t:s0:cNNN,cMMM and every other container is then denied,
  # which surfaces as `failed to list model directory: Permission denied (os
  # error 13)` before a model is even chosen. `:z` keeps it shared.
  hipfire_run: >-
    podman run --rm --replace --name ls-${MODEL_ID} --device /dev/dri
    --device /dev/kfd --device /dev/accel/accel0 --group-add keep-groups
    --security-opt seccomp=unconfined --ulimit memlock=-1:-1
    --env HIPFIRE_QWEN4_NPU_TRUNK=auto --volume
    ${hipfire_dir}:/home/hipfire/.hipfire/models:ro,z --volume
    ${hipfire_cache}:/var/cache/hipfire:z --publish 127.0.0.1:${PORT}:11435
    ${hipfire_image}

routing:
  router:
    use: capacity
    settings:
      capacity:
        pools:
          # MiB of unified memory allowed resident at once.
          # 118000 was a placeholder written before anything was measured. It
          # went up to 124000 on 2026-11-24 because gufo-ds41 measured 122002 on
          # a free pool: a ceiling under the largest model means llama-swap
          # refuses to start that model, a worse failure than a tight box.
          # 124000 is 97.3% of the 127386 MiB this machine has, and 124910 is
          # the most free RAM seen here with nothing resident - so the pool is
          # the machine, with no headroom to speak of. What keeps it standing is
          # exclusivity: the top two claims (122000, 112000) fit almost nothing
          # alongside them, the cheapest claim being 9000. The number to revisit
          # is ds41's footprint (--context 131072 at 2 sessions is where its
          # 122002 comes from), not this one. That one was looked at on
          # 2026-11-24 and left as it is - see the gufo_serve_tail comment.
          # TODO.md §2.
          mem: 124000
          # only one hipfire container may claim /dev/accel/accel0 at a time
          npu: 1
  scheduler:
    use: fifo
    settings:
      fifo:
        priority:
          hipfire-4b: 10
          openjev-q4: 5
          gufo-27b: 3

models:
  gufo-27b:
    name: Qwen3.8 27B Q4_K_XL (gufo, dflash2)
    useModelName: Qwen3.8-27B
    cmd: |
      ${gufo_run}
      --model /models/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf --speculative dflash2 --dflash-model /models/Qwen3.8-27B-GGUF/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
    cmdStop: podman stop ls-gufo-27b
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    # Measured 10:15. gufo's own host_available_mib delta is 42834 and it says
    # gpu_device_used_mib=42036; the host trough was 44288, settled 44260. 17
    # GiB is weights and dflash2, the rest is 4 sessions over 131072 tokens.
    capacities: {mem: 45000}
    evict_cost: 40
    concurrencyLimit: 4

  gufo-deepseek:
    name: DeepSeek V4 Flash IQ2XXS (gufo, dspark)
    useModelName: DeepSeek V4 Flash
    cmd: |
      ${gufo_run}
      --model /models/deepseek-v4-flash/DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf --dspark-model /models/deepseek-v4-flash/DeepSeek-V4-Flash-DSpark-support-0731.gguf
    cmdStop: podman stop ls-gufo-deepseek
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    # Measured 10:12: host trough 112875, and 112863 still gone after settling.
    # gufo counts 101145 of that (gpu_device_used_mib=100324 of 122880); the 11
    # GiB gap is host-side memory the engine does not claim - expert staging
    # and its component cache. The claim takes the host figure, because that is
    # the RAM the box is short of. At 113000 it co-resides with hipfire-4b
    # only.
    capacities: {mem: 113000}
    evict_cost: 10
    concurrencyLimit: 4

  # deepseek41flash is a compiled module: rebuild it for each pulled image with
  # ./run-gufo.sh ext update, or gufo skips it with a warning and DS41 cannot
  # load. IQ1_M is 112.4 GiB of weights, so --stream-experts keeps the dense
  # part resident and pages the 384 routed experts from SSD, filling most of
  # what is left as cache. The Engram table (103 GiB, linked as shard 00006) is
  # read from SSD and never resident.
  gufo-ds41:
    name: DeepSeek V4.1 Flash IQ1_M (gufo, dspark, streamed experts)
    # useModelName goes upstream; aliases are the names clients may use
    # (includeAliasesInList advertises them in /v1/models)
    useModelName: DeepSeek V4.1 Flash
    aliases:
      - DeepSeek V4.1 Flash
    cmd: |
      ${gufo_ds41_run}
      --model ${ds41_dir}/${ds41_q}-00001-of-00006.gguf
      --stream-experts --speculative dspark
      --dspark-model ${ds41_dir}/${ds41_draft}
    cmdStop: podman stop ls-gufo-ds41
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    # dense weights + drafter 4.6 GiB + an expert cache that defaults to "what
    # the sessions leave". No --mmproj: image input costs 0.9 GiB. Measured
    # 2026-11-24 on a free pool, first load of this model here: host available
    # 124455 -> 2453 = 122002 MiB (2 sessions, 131072 context,
    # --stream-experts, dspark draft, disk cache on), 133.9 s to
    # load_completed, gpu_device_used_mib 120143 of 122880. What it declared,
    # 114000, was 8002 MiB under that and the pool was 118000 - the entry was
    # permitted to start something the box cannot hold, the exact condition
    # this file exists to prevent. Decided 2026-11-24: the ceiling went up to
    # 124000 (see routing above) and the claim now states the measurement, so
    # the model stays loadable and the pool admits the truth. Consequence to
    # know before asking for it: 122000 of 124000 leaves less than the cheapest
    # claim (9000), so ds41 loads alone or not at all and everything else is
    # evicted for it - that 133.9 s reload is the price. Cutting --context is
    # the lever if that stops being acceptable; it was asked on 2026-11-24 and
    # left alone, because this is the family with long-context traffic, so the
    # exclusivity is accepted rather than worked around. Asked a second time the
    # same evening with traffic in hand, and it stands: 72 h of journal is 8302
    # requests to flash-next against one load of ds41, and that load was its own
    # measurement. Lowering pools.mem under this claim would make ds41 refuse
    # rather than evict, trading a warm model nobody misses for this entry being
    # unaskable. TODO.md §2.
    capacities: {mem: 122000}
    evict_cost: 60
    concurrencyLimit: 1

  gufo-flash-next:
    name: Qwen3.8 Flash Next (gufo)
    useModelName: Qwen3.8 Flash Next
    aliases:
      - Qwen3.8 Flash Next
    # The disk tier is already on and currently sits at its 8 GiB default cap -
    # full on this box (7.3 GiB chunks + 0.72 GiB private + manifests, 17473
    # files), so checkpoints evict under churn and a long prompt falls back to
    # a cold prefill. 32 GiB keeps 4x the checkpoints on disk. It is a soft cap
    # that grows only as needed and costs no RAM at all - a raise at startup
    # evicts nothing - so this is the one cache lever that is free to spend.
    # Sampling: three flags went because the engine already applies exactly them
    # to this model, not because they looked generic. gufo ignores the GGUF's
    # own general.sampling.* keys; the defaults come from
    # FlashNextSamplingDefaults() -> PresetDefaults(kQwen38), and the file's
    # general.architecture is qwen4exp, which is what selects that preset. It
    # sets top_k 20 in all three thinking modes, and leaves min_p and
    # repeat_penalty unset so they rest at the SamplingConfig defaults of 0.0
    # and 1.0 - so --top-k 20, --min-p 0.0 and --repeat-penalty 1.0 restated
    # values the server would have used anyway.
    # What stays, stays on purpose: --temperature 1.0 and --top-p 0.95 match the
    # preset only while thinking is on, and this preset's thinking-disabled row
    # is 0.7 / 0.8 with presence_penalty 1.5, so those three pins are what keep
    # a thinking-off request from sampling on different numbers. --speculative
    # mtp is not redundant either: serve infers a backend only from
    # --dspark-model, so dropping it would take the drafter away from the
    # fastest model on this box rather than simplify anything.
    # yamllint disable rule:line-length
    cmd: |
      ${gufo_run}
      --temperature 1.0 --top-p 0.95 --presence-penalty 0.0 --model /models/Qwen3.8-Flash-Next-GGUF-Gufo/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf --speculative mtp --mtp-model /models/Qwen3.8-Flash-Next-GGUF-Gufo/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf --mmproj /models/Qwen3.8-Flash-Next-GGUF-Gufo/mmproj-BF16.gguf --cache-disk-bytes 34359738368
    # yamllint enable rule:line-length
    cmdStop: podman stop ls-gufo-flash-next
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    # Measured, not guessed: available headroom 122.0 GiB unloaded -> 10.2 GiB
    # warm = 111.8 GiB (2.4 GiB belongs to the monitoring containers). RSS
    # shows 6.4 GiB because the rest is kfd device memory and streaming
    # buffers, and Mlocked stays 0; --cache-ram-bytes is already capped (32 GiB
    # default), so this is not a cache that will shrink. At 112000 of the
    # 124000 pool it can share with the cheapest claim (9000) and nothing else
    # - close to what really happens today.
    # Not discoverable on this engine: llama-swap reads a context length from
    # gufo's /v1/models and nothing else, so the --mmproj above was invisible
    # and the listing said text->text even while loaded. Claimed on evidence,
    # not on the flag: a 64px red PNG asked through the swap came back "Red",
    # 127 prompt tokens, 1.19 s, flash-next already resident. tools stays off -
    # no tool call is proven here, and a claimed capability is a client sending
    # requests that fail.
    capabilities:
      in: [text, image]
      out: [text]
    capacities: {mem: 112000}
    # no ttl key: inherits globalTTL 900 (ttl -1 = inherit, 0 = never unload)
    evict_cost: 50
    concurrencyLimit: 4

  # Inkling 2 Mini needs no module since gufo 0.37.0 (684b716, extension API
  # 0.3.47): `gufo --version` lists inkling2 0.1.0 under Built extensions, and
  # `gufo model list` offers `inkling-2-mini  inkling2  18.8 GB` from that
  # built-in. Until 2026-11-25 this ran on github.com/headbouyJB/inkling2-gufo
  # 0.1.4 (registry revision 24f8342d, api >= 0.3.20 against the then-current
  # extension API 0.3.42), and that module is removed from ${gufo_ext} so a
  # later `ext update` cannot build it back over the built-in. So the post-
  # pull rule no longer applies to this entry: a pull could leave the module
  # `needs update` and gufo would skip it silently behind a 200 /ready, and
  # core cannot be skipped. ${gufo_ext} now matters only to gufo-ds41.
  # Unsloth reorganised the upstream GGUF repo on 2026-11-23 (rev 8078d149):
  # the root files became mainline llama.cpp's layout (architecture
  # `inkling2_loop`, 744 tensors, `loop_*_ctrl_{gain,forget,down}` and
  # `loop_msg_query`) and the original layout (`inkling2`, 734 tensors,
  # `loop_attn_gain` and friends) moved to Old_Support/. The built-in registers
  # both keys - `gguf:inkling2_loop` and `gguf:inkling2`, both strings present
  # in 0.37.0's own binary - and the README called the mainline UD-Q4_K_XL the
  # primary target, so this entry runs the current root file from
  # ${inkling_dir}/ (17629760736 bytes, sha256 e6427665...) and the package's
  # original-layout copy stays as the fallback.
  # DSpark is OFF, tried on 2026-11-24 and measured out. Both halves of that
  # story are worth keeping. Which file: 0.1.2 declared no speculative mode at
  # all (its extension.json has no `speculative`, no `draft_options` and
  # `options: []`); 0.1.3 added `speculative: [dspark]` with
  # `draft_options.dspark` = --dspark-model and 0.1.4 keeps it. The extension
  # reads the original drafter's tensor set only - src/dspark.cpp:183-230 wants
  # dspark_norm, dspark_fuse, dspark_hidden_out, a per-block dflare_norm,
  # mask_embd.weight as 1-D 2304 and markov_w1 as [256][vocab_padded] - and the
  # 2026-11-23 root drafter is refused at load with "hyper-parameters differ".
  # Confirmed from the headers rather than from that sentence: the root file is
  # 58 tensors, markov_w1 [256, 200058] unpadded, an explicit markov_w2,
  # per-block ctx_mix/ctx_norm, mask_embd [2304, 7] and none of the four names
  # above, which is mainline llama.cpp's format (PR #32218); the 402278560-byte
  # original is 54 tensors and every name lines up. It is upstream's
  # dspark-Inkling-2-Mini-Q8_0_Old.gguf (sha256 2ec78510..., the same bytes the
  # loom package has had all along, hard-linked rather than duplicated).
  # Read that as module history: it settled which file the 0.1.x module could
  # read, and the module is gone. 0.37.0's inkling2 carries its own DSpark
  # paths (an Inkling2 DsparkCosts symbol is in the binary), so which tensor
  # set is admissible on core is a fresh question. What is not fresh but holds
  # is the measurement below - the drafter lost on this box on rate and on
  # acceptance - so it stays off until someone reruns that pair on core.
  # Why it is off: same weights, same empty pool, pinned to loopback, the flag
  # the only difference. Copy-heavy (rewrite 40 lines of Python) 38.8 tok/s with
  # dspark against 55.1 without; JS-to-TypeScript 43.7 both ways; a chat probe
  # 42.4 against the 43.5 the older layout had the same evening. The mechanism
  # is in the engine's own completed line - gufo core runs a built-in
  # prompt-lookup drafter whatever --speculative says, and --dspark-model
  # crowds it out (2 lookup tokens proposed against 190) while its own
  # acceptance on that copy task was 260/414 (62.8%) against lookup's 177/190
  # (93.2%). Verbatim copy is what n-gram lookup is best at, so the learned
  # drafter paid for verification and won nothing. Sample caveats: the two
  # variants generated different lengths (727 against 342 tokens), one stream
  # each, plan=serial-fallback both, and dspark also cost about 700 MiB more.
  # After the flag came off the same copy-heavy shape read 61.7 tok/s at 96.0%
  # lookup acceptance (a shorter generation, so compare acceptance and rate, not
  # totals). Its vendor's table (copy-heavy x2.23) is therefore not this box;
  # the drafter file stays on disk for the day that changes.
  # Measured 2026-11-22 on the package weights with the same serving flags
  # (projector included):
  # host_available_mib 124441 -> 83577 = 40864 MiB at 4 sessions / 131072
  # context, 13.5 s load, 43.4 tok/s decode. Only 2.3 GiB of that was RAM cache,
  # on a budget that defaults to auto (half of free RAM, at most 32 GiB) and
  # grows with use, so the number would have crept: --cache-ram-bytes bounds it,
  # and 47000 is the measured 40864 plus the ~5900 that cache may still take on
  # the way to its 8 GiB bound. Without the projector the same load measured
  # 124581 -> 84609 = 39972 MiB in 12.4 s, so the projector costs 892 MiB and
  # 1.1 s. gufo's own gpu_device_used_mib read 55250 without it and 56150 with;
  # the host_available delta is the claim on physical RAM, so that ~15 GiB gap
  # was unexplained - TODO.md §4, whose addendum records that it is not there on
  # the file set this entry loads now.
  #
  # First core reading, 2026-11-26 07:13: load_started 124071 (the engine
  # before it had already given its 111 GiB back) to load_completed 90291 =
  # 33780, against gpu_device_used_mib 33123 on that same line - 2% apart and
  # 7307 under the module pair, with `inkling2: decode weight prefetch on (step
  # 20.75 ms with it, 23.55 ms without)` new in the log. 67.1 s of load, 47.0
  # tok/s decode on both probes. The claim stays 49300: one load, no loopback
  # pin, no repeat, and a reduction is the direction that loads two models that
  # do not fit. TODO.md §8 - swept at 4 sessions over 131072, about 7000 of
  # pool is waiting there.
  # --mmproj is what enables image input: mmproj-Inkling-2-Mini-Q8_0.gguf
  # (345910944 bytes, sha256 233287272ec5ac39..., byte-identical to
  # huggingface.co/ggml-org/Inkling-2-Mini-GGUF as it stands today - the module
  # README named that projector for image input, and unsloth's own copy is
  # mmproj-F16.gguf at 641805984 bytes) sitting beside the weights in the
  # ${dir}:/models:ro mount. Proved with a real image
  # request through llama-swap, not by reading a capability field - re-proved on
  # this layout at 00:12: a 64px solid-red PNG came back "red" with
  # prompt_tokens 34, finish=stop - and again at 07:14 with no module in the
  # store: "red", finish=stop, prompt_tokens 36. The module
  # README says /v1/models then advertises input_modalities [text, image], and
  # on gufo 0.35.0 it does not. On 0.37.0 the swap's listing does carry that key
  # for this entry, but for exactly the entries with a capabilities block -
  # hipfire-4b, whose block says in: [text], is listed text-only - so the object
  # is the swap rendering this file, not the engine claiming a modality.
  # On 0.37.0 --mmproj is a core `serve llm` option, not a module-registered
  # one, which is why it survives here with no module installed. The explicit
  # path is still needed: core's auto-discovery looks for a sidecar named
  # mmproj-BF16.gguf beside the model and this file does not go by that name.
  # Sampling is Unsloth's Inkling 2 Mini recommendation (unsloth.ai/docs/models
  # /inkling-2-mini): temperature 1.0, top-p 1.0, top-k 0, min-p 0.0 - no
  # truncation beyond temperature. The module registered those same four as its
  # gufo preset (src/runner.cpp: "Unsloth/OpenAI defaults: temperature 1, no
  # truncation"); on core the same four are what `serve llm --help` calls the
  # model preset, so the flags still change nothing and now pin the vendor
  # numbers against a preset that ships inside the engine every pull. They do
  # not cost clients per-request control either: flash-next carries
  # --temperature 1.0 the same way, and against it a request at temperature 0
  # answered identically three times while temperature 1.5 gave three different
  # answers. The guide names no presence/repetition/frequency penalties, so
  # none are added and gufo leaves them off. It is silent on reasoning effort,
  # which leaves the tail's xhigh
  # (= 0.99) against the 0.9 default the model preset carries - TODO.md.
  # This is the only Inkling entry, and with the arch in core it no longer
  # needs a way back. The old one was: gufo 0.36 read a package directory's
  # llm_config.json (arch "inkling2", the GGUF name, vocab 200058) and served
  # it with --env GUFO_MODELS_DIR=/models and --model inkling-2-mini-loom, for
  # the day a `podman pull` left the module stale and skipped. That route is
  # closed and not needed: on 0.37.0 `gufo model list` reports
  # `inkling-2-mini-loom  loom  installed, no loaded extension offers it` -
  # loom 0.3.6 is built in but offers its models by repository
  # (`gufo model install loom-fun/<NAME>`), not that pinned id - and the
  # module-staleness failure it existed for cannot happen to a built-in any
  # more. So the two paths below are the entry; there is no second form to
  # switch to, and --mmproj no longer has to come off with it.
  # The built-in also offers its own download (`gufo model install
  # inkling-2-mini`, 18.8 GB, UD-Q4_K_XL plus a BF16 projector). Not used: the
  # weights and the projector proven for image input are already on disk in
  # ${inkling_dir}, and a store install would move 18.8 GB to gain nothing.
  # It was a second entry until 2026-11-24, when one set of weights was costing
  # the pool 70000 as two entries and 47000 as one. 47000 became 57000 the same
  # day (the 0.1.3 device-instrument reading recorded further below) and 49300
  # that evening, when the
  # entry moved to mainline-layout weights, the two instruments came together,
  # and the DSpark drafter was measured back off. TODO.md §6.
  gufo-inkling:
    name: Inkling-2-Mini Q4_K_XL (gufo, inkling2 kernels)
    # upstream accepts exactly the id the engine lists in /v1/models -
    # "Inkling-2-Mini" and "inkling2" are refused there, so useModelName is not
    # the client name; the alias is.
    useModelName: inkling-2-mini
    aliases:
      - Inkling-2-Mini
    cmd: |
      ${gufo_run}
      --model ${inkling_dir}/Inkling-2-Mini-UD-Q4_K_XL.gguf
      --mmproj ${inkling_dir}/mmproj-Inkling-2-Mini-Q8_0.gguf
      --cache-ram-bytes 8589934592
      --temperature 1.0 --top-p 1.0 --top-k 0 --min-p 0.0
    cmdStop: podman stop ls-gufo-inkling
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    # Measured 23:54 on inkling2 0.1.4 with the pool verified empty, the swap
    # pinned to loopback and zero foreign capacity: lines in the window. Host
    # MemAvailable is the instrument, two loads: 124474 -> 82384 = 42090 with a
    # cold page cache (load_completed elapsed 60.6 s) and 124466 -> 82685 =
    # 41781 with the weights already cached (17 s) - 0.7% apart, which is what
    # shows the trough is the resident set and not cached file reads. The
    # engine agreed with the host on this file set: the same load_completed
    # line carries host_available_mib 82486 (a delta of 41989) against
    # gpu_device_used_mib 40231, 4% apart where the 0.1.3 load on the original
    # layout had them 15 GiB apart (41064 against 56348). That does not settle
    # TODO.md §4 - one load of a different file set shows the gap is not a fixed
    # property of the engine, not which reading was wrong - but the claim no
    # longer has to carry the disagreement, and 7000 came off it for that.
    # With the drafter off, retaken at 00:12 on the configuration as it stands:
    # 124374 -> 83337 = 41037 and 124463 -> 83376 = 41087, two loads 0.12% apart
    # (the repeat is what shows the trough is the resident set), the engine on
    # the same lines reading host_available_mib 83363 (delta 41011) against
    # gpu_device_used_mib 39551 - the device figure now BELOW the host one, some
    # 15 GiB under where the previous file set put it. TODO.md §4 has the
    # addendum; it is why the claim fell 7700 rather than being retuned.
    # Claim = the larger load (41087) plus what --cache-ram-bytes (8192) may
    # still take, rounded up: 49300. Two readings of that allowance and the
    # larger one is used. The trough already carried global_ram_bytes 2413 of
    # cache (11 MB of captures, 8.8 MB of snapshots, on two tiny requests), so
    # if the bound is global the room open is 5779 and the claim would be 46900
    # - the §4-era arithmetic. If a session can each reach the bound it is the
    # whole 8192, which is 49279, and that is what is claimed: the wider reading
    # costs 2400 of pool and does not need the question settled. What is NOT in
    # this number either way: four concurrent sessions. Every load here ran one
    # stream (resident_at_admission = 1) with sessions=4 configured, so a real
    # 4-session sample would add something near 2000 and has not been taken.
    # Timing still matters as much as the figure: the host residue falls once
    # the weights are uploaded, so a reading taken after a gufo model settles is
    # the staging buffers, not the model.
    # sessions=4 over context 131072 - the window changed the weights and the
    # drafter, not the window length.
    # Same blind spot as flash-next above, same proof (the red PNG recorded on
    # the measurements block), and this is the route that carries --mmproj.
    # Both readings above are from the extension-API-0.3.42 build with the
    # external module; the engine here is now 0.37.0 with inkling2 built in. So
    # the claim is inherited, not re-measured: 49300 is what the old pair
    # produced, which makes it a claim about weights and a context, not a
    # reading of the binary running today. It stays until a sweep takes it at
    # the same 4 sessions / 131072 on a pool verified empty, and the direction
    # it is wrong in while that is outstanding is the safe one - a stale claim
    # makes the router stricter than the box, never looser.
    capabilities:
      in: [text, image]
      out: [text]
    capacities: {mem: 49300}
    # Bring-back is measured, not assumed: 60.6 s on a cold page cache (a load
    # that still had the drafter attached; the 16.4 GiB read dominates) and
    # 17-18 s warm. That is the
    # same price as flash-next, so this 30 no longer says "cheap to restore" -
    # it says "wanted far less": 38 requests against flash-next's 8302 in the
    # last 72 h. It is still the one that leaves.
    evict_cost: 30
    concurrencyLimit: 4

  # LFM3 family, from the gufo-org/lfm3-gufo-extension (extension 0.6.2:
  # providers lfm3 (text), lfm3-vl (vision), lfm3-audio-asr / lfm3-audio-tts
  # (speech) and d1 (decisions), extension API >= 0.3.20 against the image
  # the set already runs). The four checkpoints live in
  # /var/lib/models/llama/{lfm3-1.7b,lfm3-vl-2b,lfm3-audio-2b,d1-omni-2b}/,
  # downloaded by gufo model install and verified by gufo model verify.
  # The numbers below are the sweep's measurements (peak = baseline - trough,
  # rounding up). A real reply landed for each of the five: the two text
  # entries during the window, the audio and decision entries just after it
  # (their endpoints are not the chat route, so the sweep's drive leg
  # returned 404; the three load legs measured, and the real requests were
  # sent just afterwards).
  # evict_cost is the small floor of the set, not a measurement: these are
  # 2B-class models and the resident default here is the big-model set.

  lfm3-1.7b:
    name: LFM3 1.7B Q8_0 (gufo)
    # The extension declares a public name per provider (first of model_ids
    # is primary) and defaults it to the install id for audio only - text
    # serves need the flag. Pin the id as the public name and send the same
    # through useModelName, which is what the swap forwards upstream.
    useModelName: lfm3-1.7b
    cmd: >-
      ${gufo_lfm3_run}
      --model /models/lfm3-1.7b/LFM3-1.7B-Q8_0.gguf
      --context 4096 --sessions 2 --speculative off
      --served-model-name lfm3-1.7b
    cmdStop: podman stop ls-lfm3-1.7b
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    # 1846241184 bytes of Q8_0 weights (the same backbone file is what
    # lfm3-vl-2b serves with the vision sidecar). Measured 13:43 inside the
    # window: baseline 115608, trough 110398, settled 110463, peak 5210 MiB,
    # with a real chat reply (46 tokens, 595.8 prefill tps / 109.0 decode
    # tps) sent through the swap. The claim rounds the measured peak up.
    # Text in/out is claimed on that reply; nothing past it is.
    capabilities:
      in: [text]
      out: [text]
    capacities: {mem: 5500}
    evict_cost: 5
    concurrencyLimit: 4

  lfm3-vl-2b:
    name: LFM3 VL 2B Q8_0 + BF16 mmproj (gufo)
    # Same pinning as lfm3-1.7b; no aliases - the id is the one name.
    useModelName: lfm3-vl-2b
    cmd: >-
      ${gufo_lfm3_run}
      --model /models/lfm3-vl-2b/LFM3-VL-2B-Q8_0.gguf
      --mmproj /models/lfm3-vl-2b/mmproj-LFM3-VL-2B-BF16.gguf
      --context 16384 --sessions 2 --speculative off
      --served-model-name lfm3-vl-2b
    cmdStop: podman stop ls-lfm3-vl-2b
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    # 1846241184 bytes of Q8_0 weights + 378996032 bytes of BF16 vision
    # sidecar. Measured 13:43 inside the window: baseline 115682, trough
    # 109647, settled 109752, peak 6035 MiB, with a real chat reply (115
    # tokens, 601.9 prefill tps / 110.5 decode tps) sent through the swap.
    # The claim rounds the measured peak up. A text-only reply landed; no
    # image request has, so [text, image] is NOT claimed - [text] only.
    capabilities:
      in: [text]
      out: [text]
    capacities: {mem: 6500}
    evict_cost: 5
    concurrencyLimit: 4

  # The two audio entries are the same weights served through two different
  # services (`gufo serve asr` - /v1/audio/transcriptions and /v1/realtime;
  # `gufo serve tts` - /v1/audio/speech and /v1/audio/voices). The extension
  # defaults both to the public name lfm3-audio-2b, which is wrong for two
  # entries, so each passes --served-model-name to keep its own id.

  lfm3-audio-asr:
    name: LFM3 Audio 2B Q8_0 + BF16 mmproj (gufo, ASR)
    # Both audio services report the same default public name (lfm3-audio-2b
    # per the extension), so each entry pins its own id to keep the two
    # entries distinct in /v1/models and in the request model field.
    useModelName: lfm3-audio-asr
    cmd: |
      ${gufo_asr_run}
      --model /models/lfm3-audio-2b/LFM3-Audio-2B-Q8_0.gguf
      --mmproj /models/lfm3-audio-2b/mmproj-LFM3-Audio-2B-BF16.gguf
      --served-model-name lfm3-audio-asr
    cmdStop: podman stop ls-lfm3-audio-asr
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    # 1846236704 bytes of Q8_0 weights + 570846400 bytes of BF16 audio
    # sidecar. srv serves /v1/audio/transcriptions plus the realtime WebSocket
    # endpoint; checkEndpoint is the shared /ready. The load's trough inside
    # the window was 3191 MiB (base 115689 -> 112498); a real
    # /v1/audio/transcriptions request through the swap (the fixture WAV,
    # max_tokens 128) answered 200 with the text of the reviewed transcript.
    # The claim rounds the measured peak up.
    capabilities:
      in: [audio]
      out: [text]
    capacities: {mem: 3500}
    evict_cost: 5
    concurrencyLimit: 2

  lfm3-audio-tts:
    name: LFM3 Audio 2B Q8_0 + BF16 mmproj (gufo, TTS)
    useModelName: lfm3-audio-tts
    cmd: |
      ${gufo_tts_run}
      --model /models/lfm3-audio-2b/LFM3-Audio-2B-Q8_0.gguf
      --mmproj /models/lfm3-audio-2b/mmproj-LFM3-Audio-2B-BF16.gguf
      --served-model-name lfm3-audio-tts
    cmdStop: podman stop ls-lfm3-audio-tts
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    # 1846236704 bytes of Q8_0 weights + 570846400 bytes of BF16 audio
    # sidecar. srv serves /v1/audio/speech; 8 concurrent speech requests are
    # documented to share decoding steps, but concurrencyLimit is left at 2
    # pending any load test. The load's trough inside the window was 3085 MiB
    # (base 115659 -> 112574); a real /v1/audio/speech request through the
    # swap (male voice, seed 42, 180 new tokens) answered 200 with a valid
    # 24 kHz 16-bit mono WAV (138284 bytes). The claim rounds the measured
    # peak up.
    capabilities:
      in: [text]
      out: [audio]
    capacities: {mem: 3500}
    evict_cost: 5
    concurrencyLimit: 2

  # d1-Omni-2B serves the /v1/systemone decision endpoint, not a text chat:
  # requests are structured questions, packed in sets of 16, and the text
  # completions route answers 501 by design. No sessions/cache flags: the
  # decision command takes neither.
  d1-omni-2b:
    name: d1-Omni 2B Q8_0 + BF16 mmproj (gufo, decisions)
    useModelName: d1-omni-2b
    cmd: |
      ${gufo_decision_run}
      --model /models/d1-omni-2b/d1-Omni-2B-Q8_0.gguf
      --mmproj /models/d1-omni-2b/mmproj-d1-Omni-2B-BF16.gguf
      --context 8192 --served-model-name d1-omni-2b
    cmdStop: podman stop ls-d1-omni-2b
    checkEndpoint: /ready
    proxy: http://localhost:${PORT}
    # 1846241184 bytes of Q8_0 weights + 609956896 bytes of BF16 projector.
    # The extension default is to report d1-omni-2b; no aliases - the id is
    # the one name clients may send. The load's trough inside the window was
    # 3403 MiB (base 115683 -> 112280); a real /v1/systemone request through
    # the swap (refund scenario) answered 200 with refund=yes 0.948 and
    # team=billing 0.978. The claim rounds the measured peak up. No
    # capabilities block: the endpoint is structured decisions, not a
    # text->text contract, and /v1/chat/completions answers 404 by design.
    capacities: {mem: 3500}
    evict_cost: 5
    concurrencyLimit: 2

  # The four hipfire claims are full-context worst cases composed from the
  # engine's own load lines (podman logs ls-<id>): planning weights +
  # kv_bytes_per_token x max_seq + prefill scratch + draft/vision reserve.
  # hipfire's KV is vmm - "0 MiB committed at load", grown per token as context
  # is used - so what is resident after a short probe is far below what a long
  # prompt commits, and the pool has to be reserved for the latter. None of them
  # cap max_seq: every tag serves its trained 262144.
  hipfire-27b:
    name: Qwen3.8 27B mq4 (hipfire)
    useModelName: qwen3.8:27b
    cmd: |
      ${hipfire_run}
      serve qwen3.8:27b 0.0.0.0:11435
    cmdStop: podman stop ls-hipfire-27b
    proxy: http://localhost:${PORT}
    # 14937 weights + 34816 B/tok x 262144 (8704) + 1746 prefill/checkpoints +
    # 1810 dflash draft + ~420 vision staging and activation reserve = 27617.
    # These four can never be discovered, loaded or not: hipfire identifies
    # itself in /v1/models but reports no context length, so its prober takes
    # the listing only. 262144 is what every tag here serves - none of them
    # cap max_seq - the same number the mem claim above multiplies out per
    # token. tools unset: unproven, same rule as the gufo entries.
    capabilities:
      in: [text]
      out: [text]
      context: 262144
    capacities: {mem: 29000, npu: 1}
    evict_cost: 30

  hipfire-35b-a3b:
    name: Ornith 1.5 35B A3B mq4 (hipfire)
    useModelName: ornith-1.5:35b-a3b
    cmd: |
      ${hipfire_run}
      serve ornith-1.5:35b-a3b 0.0.0.0:11435
    cmdStop: podman stop ls-hipfire-35b-a3b
    proxy: http://localhost:${PORT}
    # 18139 weights + 10880 B/tok x 262144 (2720) + 2793 prefill/checkpoints =
    # 23652. The 462 MiB .mtp next to it is not claimed: the load says spec off.
    # Was 32000, which spent 7 GiB of pool on a buffer that does not exist.
    # listing-only prober; see hipfire-27b for why and for the number
    capabilities:
      in: [text]
      out: [text]
      context: 262144
    capacities: {mem: 25000, npu: 1}
    evict_cost: 30

  hipfire-4b:
    name: Qwen3.5 4B mq4 (hipfire)
    useModelName: qwen3.5:4b
    cmd: |
      ${hipfire_run}
      serve qwen3.5:4b 0.0.0.0:11435
    cmdStop: podman stop ls-hipfire-4b
    proxy: http://localhost:${PORT}
    # hipfire plans 3.2 GiB of weights for a 2468 MiB file, plus 17408 B/tok x
    # 262144 (4352) and 1251 of prefill scratch = 8973. Was 8000.
    # listing-only prober; see hipfire-27b
    capabilities:
      in: [text]
      out: [text]
      context: 262144
    capacities: {mem: 9000, npu: 1}
    evict_cost: 5

  hipfire-flash-next:
    name: Qwen3.8 Flash Next mq4 xts (hipfire)
    useModelName: qwen3.8:flash-next-mq4-xts
    cmd: |
      ${hipfire_run}
      serve qwen3.8:flash-next-mq4-xts 0.0.0.0:11435
    cmdStop: podman stop ls-hipfire-flash-next
    proxy: http://localhost:${PORT}
    # Its own plan: 62475 routed experts + 5115 non-expert + 15045 reserve, then
    # 6747 more committed at 262144 (5408 QSA context + 512 gather workspace +
    # 827 MTP) = 89382. MemAvailable agrees: ~121 GiB free with nothing else
    # resident, 33 with only this, ~88 GiB before any context is committed - and
    # the 116.7 GiB file keeps 26.8 GiB of PLE table mapped host-side, out of
    # reclaim. 95000 covers the composed worst case with headroom. The 32000
    # before it was the hazard: on paper it fitted alongside a second large
    # model inside the pool while the pair needed 165000 of physical RAM.
    # Scope 2026-11-24: a route, not a resident-time candidate - when the pool
    # plan says flash-next it means gufo-flash-next (TODO.md §2). The claim
    # stays composed-and-high either way, because the router still has to
    # refuse honestly when someone does ask for this quant.
    # listing-only prober; see hipfire-27b
    capabilities:
      in: [text]
      out: [text]
      context: 262144
    capacities: {mem: 95000, npu: 1}
    evict_cost: 30

  laya:
    name: Laya Q8_0 (test)
    cmd: |
      ${run}
      --model /models/systemone/Laya-Q8_0.gguf --spec-type none
    cmdStop: podman stop ls-laya
    proxy: http://localhost:${PORT}
    # Driven at last, 16:2x - and it did not grow. Load alone measured 1021 and
    # 1130 MiB on 10:17 and 10:46; a load followed by five /v1/systemone
    # questions (some with ~750-token states) troughs at 1006 and settles at
    # 976. So this is weights plus the model's own context plus ~1500 of
    # headroom, and the claim no longer rests on a load nobody talked to.
    # The file is 429 MiB; llama.cpp clamps the slot to n_ctx_slot 8192 ("the
    # slot context ... exceeds the context the model can serve" - that
    # parenthetical names whatever the macro asks for; the clamp is its own.
    # The clamp is on the slot only - llama_context still reports n_ctx 65536 -
    # so the numbers above are what the engine touches, not what it reserves.
    # A decision model, so /v1/chat/completions answers 501 BY DESIGN; the
    # endpoint is /v1/systemone and llama-swap forwards it, taking the model id
    # from the body's "model" field as it does for any other route. Shape, read
    # off the engine's own 400s: `state` required (a bare string is accepted);
    # `questions` a non-empty OBJECT of id -> {instructions, type}; type one of
    # choice, score, noul; choice wants `criteria` as an object, score as an
    # array of 2 to 10 levels. The trap is `options`: accepted, then ignored -
    # the choice space is the criteria keys, and it answers from their
